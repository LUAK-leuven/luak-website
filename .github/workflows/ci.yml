# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: LUAK-web CI

on:
  push:
    branches:
      - '**'
      - '!master'
  workflow_dispatch:

env:
  CI: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck && yarn lint:eslint --quiet

      - name: Start supabase server
        run: yarn supabase start --log-level error -x edge-runtime,imgproxy,logflare,postgres-meta,realtime,storage-api,studio,supavisor,vector

      - name: Start dev server
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ vars.NUXT_PUBLIC_SUPABASE_KEY }}
        run: yarn nuxt dev > nuxt.log 2>&1 &

      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium

      - name: Wait for dev server to be up
        run: npx wait-on http://localhost:3000 -t 5m

      - name: Run tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_SUPABASE_SECRET_KEY: ${{ vars.NUXT_SUPABASE_SECRET_KEY }}
        run: yarn test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./playwright-report/
          retention-days: 5

      - name: Stop supabase server
        if: always()
        run: yarn supabase stop
