name: Auto merge studio content

on:
  push:
    branches:
      - studio
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        id: cpr
        run: |
          gh pr create \
            --base master \
            --head "${{ github.ref_name }}" \
            --title "Update content" \
            --body "Automatically generated PR for changes made in Nuxt Studio"
        env:
          GH_TOKEN: ${{ secrets.LUAK_PR_GITHUB_TOKEN }}

      - name: Enable pull request automerge
        run: |
          gh pr merge \
          --auto \
          --merge \
          "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.LUAK_PR_GITHUB_TOKEN }}
